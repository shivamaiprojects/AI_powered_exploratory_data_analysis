[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-agent"
version = "0.1.0"
description = "AI-powered Exploratory Data Analysis agent"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Shivam" }]
dependencies = [
    "pandas",
    "numpy",
    "plotly",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "ucimlrepo",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true